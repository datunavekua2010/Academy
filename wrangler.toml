# Production Worker and static assets. This routes CAPTCHA pre-verification;
# Supabase Auth must also enforce CAPTCHA independently. Deploy only after the
# production widget/secret, build variables and database upgrade are ready.
# Confirm in the Cloudflare dashboard which Worker actually serves axiacad.uk;
# Workers Builds may override this name or use settings not visible in this repo.
name = "axiom-academy"
main = "server/auth-captcha-review-worker.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/auth/turnstile-verify"]

[vars]
TURNSTILE_REVIEW_ENABLED = "true"
TURNSTILE_ALLOWED_ORIGIN = "https://axiacad.uk"
# TURNSTILE_WORKER_SECRET must be provisioned as a Cloudflare Worker secret,
# never as a [vars] entry or VITE_ build variable.

