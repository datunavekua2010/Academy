# Production Worker and static assets. This routes CAPTCHA pre-verification;
# Supabase Auth must also enforce CAPTCHA independently. Deploy only after the
# rollout prerequisites are ready. The first script deployment must precede
# adding Worker secrets if the existing deployment serves static assets only.
# The owner identified axiomacademy9 as the Worker serving axiacad.uk.
# Workers Builds may override settings not visible in this repository.
name = "axiomacademy9"
main = "server/auth-captcha-review-worker.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/auth/turnstile-verify", "/api/auth/google-proof/start", "/api/auth/google-proof/callback"]

[vars]
TURNSTILE_REVIEW_ENABLED = "true"
TURNSTILE_ALLOWED_ORIGIN = "https://axiacad.uk"
# TURNSTILE_WORKER_SECRET must be provisioned as a Cloudflare Worker secret,
# never as a [vars] entry or VITE_ build variable.

